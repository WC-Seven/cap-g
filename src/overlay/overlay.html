<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: transparent; cursor: crosshair; }
    #canvas { display: block; position: fixed; top: 0; left: 0; }
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 6px 16px;
      border-radius: 5px;
      font: 13px/1.5 'Segoe UI', Arial, sans-serif;
      pointer-events: none;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hint"></div>
  <script src="overlay.js"></script>
</body>
</html>
