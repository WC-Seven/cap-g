<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="editor.css">
</head>
<body>

  <!-- Titlebar arrastável -->
  <div id="titlebar">
    <img id="title-logo" src="../../assets/logo.png" alt=""
         onerror="this.style.display='none'">
    <span id="drag-area">Cap-G</span>
    <button id="btn-close-win" title="Fechar">✕</button>
  </div>

  <!-- Área principal -->
  <div id="workspace">

    <!-- Canvas de edição -->
    <div id="canvas-wrap">
      <div id="canvas-container">
        <canvas id="canvas"></canvas>
        <!-- Overlay de recorte — visível apenas no modo crop -->
        <canvas id="crop-canvas"></canvas>
      </div>
    </div>

    <!-- Barra de ferramentas vertical -->
    <div id="toolbar-right">

      <!-- Caneta -->
      <button class="tool" data-tool="pen" title="Caneta (P)">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <path d="M11.5 1.5a1.5 1.5 0 0 1 2.12 2.12L5 12.24 2 14l1.76-3L11.5 1.5z" fill="currentColor"/>
        </svg>
      </button>

      <!-- Linha -->
      <button class="tool" data-tool="line" title="Linha (L)">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <line x1="2" y1="14" x2="14" y2="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Seta -->
      <button class="tool" data-tool="arrow" title="Seta (A)">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <line x1="2" y1="14" x2="13" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="7,3 13,3 13,9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Forma: retângulo ou elipse — clique direito para trocar -->
      <button class="tool" id="tool-shape" data-tool="rect"
              title="Retângulo (R) · clique direito → trocar forma">
        <svg id="shape-icon" width="18" height="18" viewBox="0 0 16 16">
          <rect x="2" y="4" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="shape-caret">▾</span>
      </button>

      <!-- Borrar (blur) — clique direito para trocar forma -->
      <button class="tool" id="tool-blur" data-tool="blur"
              title="Borrar dados sensíveis (B) · clique direito → trocar forma">
        <svg id="blur-icon" width="18" height="18" viewBox="0 0 16 16">
          <rect x="1" y="1" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="5"  cy="6"  r="1.3" fill="currentColor" opacity="0.5"/>
          <circle cx="8"  cy="6"  r="1.3" fill="currentColor" opacity="0.5"/>
          <circle cx="11" cy="6"  r="1.3" fill="currentColor" opacity="0.5"/>
          <circle cx="5"  cy="10" r="1.3" fill="currentColor" opacity="0.5"/>
          <circle cx="8"  cy="10" r="1.3" fill="currentColor" opacity="0.5"/>
          <circle cx="11" cy="10" r="1.3" fill="currentColor" opacity="0.5"/>
        </svg>
        <span class="shape-caret">▾</span>
      </button>

      <!-- Texto -->
      <button class="tool" data-tool="text" title="Texto (T)">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <text x="2" y="13" font-family="Arial" font-weight="bold" font-size="14" fill="currentColor">T</text>
        </svg>
      </button>

      <!-- Recortar -->
      <button class="tool" data-tool="crop" title="Recortar área (C)">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <line x1="4" y1="1" x2="4" y2="11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="1" y1="4" x2="11" y2="4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="12" y1="5" x2="12" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="5" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <rect x="4" y="4" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2,1.5" opacity="0.5"/>
        </svg>
      </button>

      <div class="sep"></div>

      <!-- Seletor de cor -->
      <label class="color-wrap" title="Cor">
        <input type="color" id="color-picker" value="#ff0000">
      </label>

      <!-- Espessura -->
      <div class="stroke-wrap" title="Espessura do traço">
        <input type="range" id="stroke-range" min="1" max="10" value="2" orient="vertical">
      </div>

      <div class="sep"></div>

      <!-- Desfazer -->
      <button class="tool" data-tool="undo" title="Desfazer (Ctrl+Z)">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <path d="M4 7H1V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M1 7a7 7 0 1 1 1.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Refazer -->
      <button class="tool" data-tool="redo" title="Refazer (Ctrl+Shift+Z)">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <path d="M12 7h3V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 7a7 7 0 1 0-1.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

    </div>
  </div>

  <!-- Barra inferior de ações -->
  <div id="toolbar-bottom">
    <button id="btn-expand" title="Reselecionar área no screenshot original (pode ampliar ou reduzir)">⤢ Reselecionar</button>
    <button id="btn-save">💾 Salvar</button>
    <button id="btn-copy">📋 Copiar</button>
    <button id="btn-close">✕ Fechar</button>
  </div>

  <!-- Menu de contexto do texto (botão direito sobre texto confirmado) -->
  <div id="text-ctx-menu" hidden>
    <button class="ctx-item" id="ctx-edit">✏️ Editar texto</button>
    <button class="ctx-item" id="ctx-delete">🗑️ Deletar texto</button>
  </div>

  <!-- Overlay de reseleção (ampliar / reduzir a partir do screenshot original) -->
  <div id="expand-overlay">
    <canvas id="expand-canvas"></canvas>
    <div id="expand-hint"></div>
  </div>

  <!-- Dica do modo recorte -->
  <div id="crop-hint"></div>

  <!-- Menu popup de formas do blur -->
  <div id="blur-menu" hidden>
    <button class="shape-opt selected" data-blur-shape="rect" data-label="Retângulo">
      <svg width="14" height="14" viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Retângulo
    </button>
    <button class="shape-opt" data-blur-shape="ellipse" data-label="Elipse / Círculo">
      <svg width="14" height="14" viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6" ry="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Elipse / Círculo
    </button>
  </div>

  <!-- Menu popup de formas -->
  <div id="shape-menu" hidden>
    <button class="shape-opt selected" data-shape="rect" data-label="Retângulo">
      <svg width="14" height="14" viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Retângulo
    </button>
    <button class="shape-opt" data-shape="ellipse" data-label="Elipse / Círculo">
      <svg width="14" height="14" viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6" ry="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Elipse / Círculo
    </button>
  </div>

  <script src="editor.js"></script>
</body>
</html>
